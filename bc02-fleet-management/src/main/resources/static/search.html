<!DOCTYPE html>
<html>
<head>
    <title>Search Vehicles</title>
</head>
<body>

<h2>Search Available Vehicles</h2>

Latitude: <input type="number" step="0.0001" id="lat"><br><br>
Longitude: <input type="number" step="0.0001" id="lon"><br><br>
Radius (km): <input type="number" id="radius"><br><br>

<button onclick="search()">Search</button>

<h3>Results:</h3>
<table border="1" id="results">
    <tr>
        <th>ID</th>
        <th>Type</th>
        <th>Description</th>
        <th>Status</th>
    </tr>
</table>

<script>
function search() {
    const lat = document.getElementById("lat").value;
    const lon = document.getElementById("lon").value;
    const radius = document.getElementById("radius").value;

    fetch(`http://localhost:8090/vehicles/available?lat=${lat}&lon=${lon}&radius=${radius}`)
        .then(res => res.json())
        .then(data => {
            const table = document.getElementById("results");
            table.innerHTML = `
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th>Status</th>
                </tr>
            `;

            data.forEach(v => {
                table.innerHTML += `
                    <tr>
                        <td>${v.id}</td>
                        <td>${v.type}</td>
                        <td>${v.description}</td>
                        <td>${v.status}</td>
                    </tr>
                `;
            });
        });
}
</script>

</body>
</html>
