<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Rating – Instant Mobility</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/ratings}">BC-05 Rating</a>
    </div>
</nav>

<div class="container" style="max-width: 620px;">
    <h2 class="mb-4">Submit a Rating</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/ratings/submit}" th:object="${form}" method="post" novalidate>

        <div class="mb-3">
            <label class="form-label fw-semibold">Booking ID</label>
            <input type="number" class="form-control" th:field="*{bookingId}"
                   placeholder="e.g. 1001" required>
            <div class="text-danger small"
                 th:if="${#fields.hasErrors('bookingId')}"
                 th:errors="*{bookingId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">User ID</label>
            <input type="number" class="form-control" th:field="*{userId}"
                   placeholder="e.g. 1" required>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label fw-semibold">Vehicle ID</label>
                <input type="number" class="form-control" th:field="*{vehicleId}"
                       placeholder="e.g. 10" required>
            </div>
            <div class="col">
                <label class="form-label fw-semibold">Provider ID</label>
                <input type="number" class="form-control" th:field="*{providerId}"
                       placeholder="e.g. 100" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label fw-semibold">Vehicle Score (1–5)</label>
                <input type="number" class="form-control" th:field="*{vehicleScore}"
                       min="1" max="5" required>
                <div class="text-danger small"
                     th:if="${#fields.hasErrors('vehicleScore')}"
                     th:errors="*{vehicleScore}"></div>
            </div>
            <div class="col">
                <label class="form-label fw-semibold">Provider Score (1–5)</label>
                <input type="number" class="form-control" th:field="*{providerScore}"
                       min="1" max="5" required>
                <div class="text-danger small"
                     th:if="${#fields.hasErrors('providerScore')}"
                     th:errors="*{providerScore}"></div>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Comment <small class="text-muted">(optional)</small></label>
            <textarea class="form-control" th:field="*{comment}" rows="3"
                      placeholder="Share your experience..."></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Submit Rating</button>
            <a th:href="@{/ratings}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
