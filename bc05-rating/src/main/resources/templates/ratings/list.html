<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ratings – Instant Mobility</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/ratings}">BC-05 Rating</a>
        <a class="btn btn-light btn-sm" th:href="@{/ratings/submit}">+ Submit Rating</a>
    </div>
</nav>

<div class="container">
    <div th:if="${success}" class="alert alert-success alert-dismissible" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 class="mb-3"
        th:text="${filter != null ? 'Ratings for ' + filter : 'All Ratings'}">
        All Ratings
    </h2>

    <div th:if="${averageScore != null}" class="alert alert-info mb-3">
        Average vehicle score:
        <strong th:text="${#numbers.formatDecimal(averageScore, 1, 2)}"></strong> / 5
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-3" th:if="${not #lists.isEmpty(ratings)}">
        <div class="col" th:each="r : ${ratings}">
            <div class="card h-100 shadow-sm">
                <div class="card-header d-flex justify-content-between">
                    <span>Rating #<span th:text="${r.ratingId}"></span></span>
                    <small class="text-muted">
                        Booking #<span th:text="${r.bookingId}"></span>
                    </small>
                </div>
                <div class="card-body">
                    <p class="mb-1">
                        <strong>Vehicle</strong>
                        #<a th:href="@{/ratings/vehicle/{id}(id=${r.vehicleId})}"
                            th:text="${r.vehicleId}"></a>
                        &nbsp;–&nbsp;
                        Score: <span class="badge bg-success" th:text="${r.vehicleScore} + '/5'"></span>
                    </p>
                    <p class="mb-1">
                        <strong>Provider</strong>
                        #<a th:href="@{/ratings/provider/{id}(id=${r.providerId})}"
                            th:text="${r.providerId}"></a>
                        &nbsp;–&nbsp;
                        Score: <span class="badge bg-info text-dark" th:text="${r.providerScore} + '/5'"></span>
                    </p>
                    <p class="text-muted fst-italic mb-1"
                       th:if="${r.comment != null and !r.comment.isEmpty()}"
                       th:text="'&quot;' + r.comment + '&quot;'"></p>
                    <small class="text-muted"
                           th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/ratings/{id}(id=${r.ratingId})}"
                       class="btn btn-sm btn-outline-primary">View Detail</a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(ratings)}" class="text-center text-muted py-5">
        <p class="fs-5">No ratings found.</p>
        <a th:href="@{/ratings/submit}" class="btn btn-primary">Submit the first rating</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
