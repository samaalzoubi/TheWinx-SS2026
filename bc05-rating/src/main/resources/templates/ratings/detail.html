<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rating Detail – Instant Mobility</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/ratings}">BC-05 Rating</a>
    </div>
</nav>

<div class="container" style="max-width: 620px;">
    <h2 class="mb-4">Rating Detail</h2>

    <div class="card shadow-sm">
        <div class="card-header">
            Rating #<span th:text="${rating.ratingId}"></span>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-5">Rating ID</dt>
                <dd class="col-sm-7" th:text="${rating.ratingId}"></dd>

                <dt class="col-sm-5">Booking ID</dt>
                <dd class="col-sm-7" th:text="${rating.bookingId}"></dd>

                <dt class="col-sm-5">User ID</dt>
                <dd class="col-sm-7" th:text="${rating.userId}"></dd>

                <dt class="col-sm-5">Vehicle ID</dt>
                <dd class="col-sm-7">
                    <a th:href="@{/ratings/vehicle/{id}(id=${rating.vehicleId})}"
                       th:text="'#' + rating.vehicleId"></a>
                </dd>

                <dt class="col-sm-5">Vehicle Score</dt>
                <dd class="col-sm-7">
                    <span class="badge bg-success fs-6"
                          th:text="${rating.vehicleScore} + ' / 5'"></span>
                </dd>

                <dt class="col-sm-5">Provider ID</dt>
                <dd class="col-sm-7">
                    <a th:href="@{/ratings/provider/{id}(id=${rating.providerId})}"
                       th:text="'#' + rating.providerId"></a>
                </dd>

                <dt class="col-sm-5">Provider Score</dt>
                <dd class="col-sm-7">
                    <span class="badge bg-info text-dark fs-6"
                          th:text="${rating.providerScore} + ' / 5'"></span>
                </dd>

                <dt class="col-sm-5">Comment</dt>
                <dd class="col-sm-7 fst-italic"
                    th:text="${rating.comment != null and !rating.comment.isEmpty()} ? rating.comment : '—'">
                </dd>

                <dt class="col-sm-5">Submitted at</dt>
                <dd class="col-sm-7"
                    th:text="${#temporals.format(rating.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></dd>
            </dl>
        </div>
        <div class="card-footer d-flex gap-2">
            <a th:href="@{/ratings}" class="btn btn-sm btn-outline-secondary">Back to list</a>
            <a th:href="@{/ratings/vehicle/{id}(id=${rating.vehicleId})}"
               class="btn btn-sm btn-outline-primary">Vehicle ratings</a>
            <a th:href="@{/ratings/provider/{id}(id=${rating.providerId})}"
               class="btn btn-sm btn-outline-info">Provider ratings</a>
        </div>
    </div>
</div>
</body>
</html>
