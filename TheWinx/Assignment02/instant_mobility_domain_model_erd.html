
<style>
#erd svg { width: 100%; }
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd" style="padding: 1rem 0;"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2466' : '#EEEDFE',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
    primaryTextColor: dark ? '#CECBF6' : '#3C3489',
  },
});

const diagram = `erDiagram
  USER ||--o{ BOOKING : makes
  USER ||--o{ RATING : writes
  PROVIDER ||--o{ VEHICLE : owns
  VEHICLE ||--o{ BOOKING : "is for"
  BOOKING ||--o| PAYMENT : "settled by"
  BOOKING ||--o| RATING : has
  VEHICLE ||--o{ RATING : rates
  PROVIDER ||--o{ RATING : rates

  USER {
    Long id PK
    String name
    String email
    String passwordHash
    Date dateOfBirth
    Date registeredAt
  }
  PROVIDER {
    Long id PK
    String name
    String email
    String passwordHash
    String companyName
    Date registeredAt
  }
  VEHICLE {
    Long id PK
    Long providerId FK
    VehicleType type
    String description
    VehicleStatus status
    Double currentLatitude
    Double currentLongitude
    BigDecimal pricePerUnit
    BillingModel billingModel
    Integer maxDurationMinutes
    Integer maxKilometers
    Integer minAge
    Integer maxPersons
  }
  BOOKING {
    Long id PK
    Long userId FK
    Long vehicleId FK
    DateTime startTime
    DateTime endTime
    Double startLatitude
    Double startLongitude
    Double endLatitude
    Double endLongitude
    Double distanceKm
    BigDecimal totalCost
    BookingStatus status
  }
  PAYMENT {
    Long id PK
    Long bookingId FK
    BigDecimal amount
    DateTime paidAt
    PaymentStatus status
  }
  RATING {
    Long id PK
    Long bookingId FK
    Long userId FK
    Long vehicleId FK
    Long providerId FK
    Integer vehicleScore
    Integer providerScore
    String comment
    Date createdAt
  }
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
