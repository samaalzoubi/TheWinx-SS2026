<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Provider Profile - Identity &amp; Access</title>
  <link rel="stylesheet" th:href="@{/css/theme.css}"/>
</head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<main class="narrow">
  <h1><span class="badge badge-info">&#127970; Provider</span> Profile</h1>

  <div class="card">
    <dl class="kv">
      <dt>Id</dt><dd th:text="${provider.id}"></dd>
      <dt>Company name</dt><dd th:text="${provider.companyName}"></dd>
      <dt>Contact name</dt><dd th:text="${provider.contactName}"></dd>
      <dt>Email</dt><dd th:text="${provider.email}"></dd>
      <dt>Phone number</dt><dd th:text="${provider.phoneNumber} ?: '-'"></dd>
      <dt>Registered at</dt><dd th:text="${provider.registeredAt}"></dd>
    </dl>
  </div>

  <div class="card">
    <h2>Actions</h2>
    <a class="btn ghost" th:if="${token}" th:href="@{/token-inspector(token=${token})}">Re-check this token in the Token Inspector</a>
    <a class="btn ghost" th:href="@{/token-inspector}">Open Token Inspector</a>
    <a class="btn ghost" th:href="@{/directory}">Back to directory</a>
  </div>

  <p class="muted"><a th:href="@{/ui}">&larr; Back to home</a></p>
</main>
</body>
</html>
