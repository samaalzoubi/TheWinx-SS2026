<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Vehicle ratings</title>
    <link rel="stylesheet" href="/css/theme.css"/>
</head>
<body>
<header th:replace="~{ui/fragments/nav :: header}"></header>
<main class="container">
    <h1>Ratings for vehicle <span th:text="${vehicleId}"></span></h1>
    <p class="subtitle">All feedback collected for this vehicle.</p>

    <div class="stat-grid">
        <div class="stat-tile">
            <span class="icon">🚗</span>
            <div class="value" th:text="${count}"></div>
            <div class="label">Total ratings</div>
        </div>
        <div class="stat-tile">
            <span class="icon">⭐</span>
            <div class="value" th:text="${#numbers.formatDecimal(average, 1, 2)}"></div>
            <div class="label">Average vehicle score</div>
        </div>
    </div>

    <div class="card">
        <table th:if="${!#lists.isEmpty(ratings)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Booking</th>
                <th>Provider</th>
                <th>Vehicle score</th>
                <th>Provider score</th>
                <th>Comment</th>
                <th>Created at</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="rating : ${ratings}">
                <td th:text="${rating.id}"></td>
                <td th:text="${rating.ratingTarget.bookingId}"></td>
                <td th:text="${rating.ratingTarget.providerId}"></td>
                <td><span class="stars" th:text="${T(com.winx.rating.api.ui.support.Stars).render(rating.review.vehicleScore)}"></span></td>
                <td><span class="stars" th:text="${T(com.winx.rating.api.ui.support.Stars).render(rating.review.providerScore)}"></span></td>
                <td th:text="${rating.review.comment}"></td>
                <td th:text="${rating.createdAt}"></td>
            </tr>
            </tbody>
        </table>

        <div class="empty-state" th:if="${#lists.isEmpty(ratings)}">
            <span class="icon">🗒️</span>
            No ratings yet for this vehicle.
        </div>
    </div>

    <p><a th:href="@{/ui}">&larr; Back home</a></p>
</main>
</body>
</html>
