# Centrally-managed overrides for bc04-payment.
# Payment wraps its own external-gateway adapter call in a circuit breaker
# (there is no other bounded context it calls into — it is a pure leaf/downstream
# context per the Assignment 03 context map).
resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
