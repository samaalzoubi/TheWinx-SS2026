<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Register as Provider')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="card">
    <h2>Create a Provider account</h2>
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <form method="post" action="/register/provider">
        <label>Company name<input type="text" name="companyName" required="required"/></label>
        <label>Contact person<input type="text" name="contactName" required="required"/></label>
        <label>Email<input type="email" name="email" required="required"/></label>
        <label>Password<input type="password" name="password" required="required"/></label>
        <label>Phone number<input type="text" name="phoneNumber" required="required"/></label>
        <button type="submit">Register</button>
    </form>
    <p class="muted">Already have an account? <a href="/login">Log in</a></p>
</div>
</body>
</html>
