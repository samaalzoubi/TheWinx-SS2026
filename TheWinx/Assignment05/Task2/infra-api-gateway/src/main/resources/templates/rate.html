<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Rate your ride')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="card">
    <h2>Rate your ride</h2>
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <p class="muted" th:if="${booking != null}"
       th:text="'Vehicle: ' + ${booking.vehicleType()} + ' | Cost: ' + ${booking.totalCost()} + ' EUR'"></p>

    <form method="post" action="/ratings">
        <input type="hidden" name="bookingId" th:value="${bookingId}"/>
        <label>Vehicle score (1-5)
            <select name="vehicleScore" required="required">
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Good</option>
                <option value="3">3 - Okay</option>
                <option value="2">2 - Poor</option>
                <option value="1">1 - Bad</option>
            </select>
        </label>
        <label>Provider score (1-5)
            <select name="providerScore" required="required">
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Good</option>
                <option value="3">3 - Okay</option>
                <option value="2">2 - Poor</option>
                <option value="1">1 - Bad</option>
            </select>
        </label>
        <label>Comment (optional)<input type="text" name="comment"/></label>
        <button type="submit">Submit rating</button>
    </form>
</div>
</body>
</html>
