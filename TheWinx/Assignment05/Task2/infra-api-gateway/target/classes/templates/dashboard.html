<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Dashboard')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<p th:if="${error}" class="error" th:text="${error}"></p>

<div class="stat-grid">
    <div class="stat-tile"><span class="icon">🛴</span><span class="value" th:text="${totalCount}">0</span><span class="label">Total rides</span></div>
    <div class="stat-tile"><span class="icon">⏳</span><span class="value" th:text="${activeCount}">0</span><span class="label">Active now</span></div>
    <div class="stat-tile"><span class="icon">✅</span><span class="value" th:text="${completedCount}">0</span><span class="label">Completed</span></div>
    <div class="stat-tile"><span class="icon">⭐</span><span class="value" th:text="${toRateCount}">0</span><span class="label">Awaiting your rating</span></div>
</div>

<div class="card">
    <h2>My rides</h2>
    <p class="muted" th:if="${#lists.isEmpty(rows)}">No bookings yet - <a href="/search">search for a vehicle</a> to get started.</p>

    <table th:unless="${#lists.isEmpty(rows)}">
        <thead>
        <tr>
            <th>Vehicle</th>
            <th>Status</th>
            <th>Started</th>
            <th>Cost</th>
            <th>Payment</th>
            <th>Rating</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}">
            <td>
                <strong th:text="${row.booking().vehicleType()}">TYPE</strong><br/>
                <span class="muted" th:text="'#' + ${row.booking().vehicleId()}">#id</span>
            </td>
            <td>
                <span class="badge"
                      th:classappend="${row.booking().status() == 'ACTIVE'} ? 'badge-active' : (${row.booking().status() == 'COMPLETED'} ? 'badge-completed' : 'badge-cancelled')"
                      th:text="${row.booking().status()}">STATUS</span>
            </td>
            <td th:text="${row.booking().startTime()}">start</td>
            <td>
                <span th:if="${row.booking().totalCost() != null}"
                      th:text="${row.booking().totalCost()} + ' EUR'">cost</span>
                <span th:unless="${row.booking().totalCost() != null}" class="muted">-</span>
            </td>
            <td>
                <span th:if="${row.payment() != null}" class="badge"
                      th:classappend="${row.payment().status() == 'PAID'} ? 'badge-paid' : (${row.payment().status() == 'FAILED'} ? 'badge-failed' : 'badge-pending')"
                      th:text="${row.payment().status()}">PAY</span>
                <span th:if="${row.payment() == null and row.isCompleted()}" class="muted">no record</span>
                <span th:unless="${row.isCompleted()}" class="muted">-</span>
            </td>
            <td>
                <span th:if="${row.rating() != null}"
                      th:text="${row.rating().vehicleScore()} + '/5 vehicle, ' + ${row.rating().providerScore()} + '/5 provider'">rated</span>
                <a th:if="${row.canBeRated()}" class="button-like" th:href="@{/ratings/new(bookingId=${row.booking().id()})}">Rate this ride</a>
                <span th:if="${!row.isCompleted() and row.rating() == null}" class="muted">-</span>
            </td>
            <td>
                <a class="button-like" style="margin-bottom:.4rem;display:inline-block;" th:href="@{/bookings/{id}(id=${row.booking().id()})}">Details</a><br/>
                <form th:if="${row.isActive()}" class="inline" method="post" th:action="@{/bookings/{id}/end(id=${row.booking().id()})}"
                      th:onsubmit="'return endRideWithLocation(this,' + ${row.booking().startLatitude()} + ',' + ${row.booking().startLongitude()} + ')'">
                    <input type="hidden" name="endLatitude"/>
                    <input type="hidden" name="endLongitude"/>
                    <select name="paymentMethod" style="width:auto;display:inline-block;margin-right:.3rem;">
                        <option value="CARD">💳 Card</option>
                        <option value="PAYPAL">🅿️ PayPal</option>
                    </select>
                    <button type="submit" title="Uses your device location to end the ride">📍 End ride</button>
                </form>
                <form th:if="${row.isActive()}" class="inline" method="post" th:action="@{/bookings/{id}/cancel(id=${row.booking().id()})}">
                    <button type="submit" class="danger">Cancel</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
