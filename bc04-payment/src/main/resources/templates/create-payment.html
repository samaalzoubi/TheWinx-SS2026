<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Payment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            color: #1f497d;
        }

        form {
            width: 420px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 20px;
            padding: 10px 16px;
            background-color: #1f497d;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>Create Payment</h1>

<p>
    Booking data is mocked here by manually entering booking ID, user ID, and amount.
</p>

<form th:action="@{/payments}" method="post">

    <label>Booking ID</label>
    <input type="number" name="bookingId" value="1001" required>

    <label>User ID</label>
    <input type="number" name="userId" value="501" required>

    <label>Amount</label>
    <input type="number" step="0.01" name="amount" value="29.99" required>

    <label>Currency</label>
    <input type="text" name="currency" value="EUR" required>

    <label>Payment Method</label>
    <select name="paymentMethod">
        <option th:each="method : ${paymentMethods}"
                th:value="${method}"
                th:text="${method}">
        </option>
    </select>

    <button type="submit">Process Payment</button>

</form>

<a href="/payments">Back to Payments</a>

</body>
</html>
