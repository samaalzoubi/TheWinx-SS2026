<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Registration Successful - Identity &amp; Access</title>
  <link rel="stylesheet" th:href="@{/css/theme.css}"/>
</head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<main class="narrow">
  <h1>&#128100; User registered successfully</h1>
  <div class="alert alert-success">Account created.</div>

  <div class="card">
    <dl class="kv">
      <dt>Id</dt><dd th:text="${user.id}"></dd>
      <dt>Name</dt><dd th:text="${user.name}"></dd>
      <dt>Email</dt><dd th:text="${user.email}"></dd>
    </dl>
  </div>

  <div class="card">
    <a class="btn" th:href="@{/ui/users/{id}(id=${user.id})}">View profile</a>
    <a class="btn ghost" th:href="@{/ui/login}">Go to login</a>
    <a class="btn ghost" th:href="@{/directory}">Open directory</a>
  </div>

  <p class="muted"><a th:href="@{/ui}">&larr; Back to home</a></p>
</main>
</body>
</html>
