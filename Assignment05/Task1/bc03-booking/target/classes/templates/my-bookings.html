<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>My Bookings &middot; BC-03 Booking</title>
    <link rel="stylesheet" href="/css/theme.css"/>
    <script src="/js/end-ride.js"></script>
</head>
<body>
<header th:replace="~{fragments/header :: topbar}"></header>
<main class="container">
    <h1>My bookings - user <span th:text="${userId}"></span></h1>
    <p class="subtitle"><a th:href="@{/ui/search-book(userId=${userId})}">Search &amp; book another ride</a> for this user.</p>

    <p th:if="${message}" class="alert alert-success" th:text="${message}"></p>
    <p th:if="${error}" class="alert alert-error" th:text="${error}"></p>

    <div class="card">
        <h2>Switch user</h2>
        <form th:action="@{/ui/my-bookings}" method="get" class="field-row" style="align-items:end;">
            <div>
                <label for="userId2">User id</label>
                <input id="userId2" type="number" name="userId" th:value="${userId}" min="1" required="required"/>
            </div>
            <div><button type="submit">View</button></div>
        </form>
    </div>

    <div class="card">
        <h2>Booking history</h2>
        <table th:if="${not #lists.isEmpty(bookings)}">
            <thead>
            <tr>
                <th>Id</th>
                <th>Vehicle</th>
                <th>Status</th>
                <th>Start</th>
                <th>End</th>
                <th>Distance (km)</th>
                <th>Total cost</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bookings}">
                <td><a th:href="@{/ui/bookings/{id}(id=${b.id})}" th:text="'#' + ${b.id}"></a></td>
                <td>
                    <span th:text="${T(com.winx.booking.api.ui.VehicleIcons).iconFor(b.vehicleSnapshot.type)}"></span>
                    <span th:text="${b.vehicleSnapshot.type} + ' (#' + ${b.vehicleSnapshot.vehicleId} + ')'"></span>
                </td>
                <td th:switch="${b.status.name()}">
                    <span th:case="'ACTIVE'" class="badge badge-active" th:text="${b.status}"></span>
                    <span th:case="'COMPLETED'" class="badge badge-completed" th:text="${b.status}"></span>
                    <span th:case="*" class="badge badge-cancelled" th:text="${b.status}"></span>
                </td>
                <td th:text="${b.startTime}"></td>
                <td th:text="${b.endTime} ?: '-'"></td>
                <td th:text="${b.rideSummary.distanceKm} ?: '-'"></td>
                <td th:text="${b.rideSummary.totalCost} ?: '-'"></td>
                <td>
                    <a class="btn ghost small" th:href="@{/ui/bookings/{id}(id=${b.id})}">Details</a>
                    <div th:if="${b.status.name() == 'ACTIVE'}" style="margin-top:.5rem;">
                        <form th:action="@{/ui/my-bookings/{userId}/{id}/end(userId=${userId},id=${b.id})}" method="post" class="inline"
                              th:onsubmit="'return endRideWithLocation(this,' + ${b.startLatitude} + ',' + ${b.startLongitude} + ')'">
                            <input type="hidden" name="endLatitude"/>
                            <input type="hidden" name="endLongitude"/>
                            <select name="paymentMethod" style="width:auto;display:inline-block;margin:0 .3rem;">
                                <option value="CARD">💳 Card</option>
                                <option value="PAYPAL">🅿️ PayPal</option>
                            </select>
                            <button type="submit" class="small accent">📍 End ride (uses your location)</button>
                        </form>
                        <form th:action="@{/ui/my-bookings/{userId}/{id}/cancel(userId=${userId},id=${b.id})}" method="post" class="inline">
                            <button type="submit" class="small danger">Cancel</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(bookings)}">
            <span class="icon">🧾</span>
            No bookings yet for this user - go <a th:href="@{/ui/search-book(userId=${userId})}">search &amp; book</a> one.
        </div>
    </div>
</main>
</body>
</html>
