<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>My Fleet · Fleet Management</title>
    <link rel="stylesheet" href="/css/theme.css"/>
</head>
<body>
<div th:replace="~{fragments/header :: topbar}"></div>
<main class="container">
    <h1>Fleet dashboard - provider #<span th:text="${providerId}">1</span></h1>
    <p class="subtitle">Add, edit, or remove vehicles in your fleet.</p>

    <div th:replace="~{fragments/header :: tabs(active='fleet')}"></div>

    <div class="card">
        <h2>Vehicles (<span th:text="${#lists.size(vehicles)}">0</span>)</h2>

        <table th:if="${not #lists.isEmpty(vehicles)}">
            <thead>
            <tr>
                <th>Id</th><th>Type</th><th>Status</th><th>Price</th><th>Location</th><th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${vehicles}">
                <td th:text="${v.id}"></td>
                <td>
                    <span th:insert="~{fragments/header :: vehicleIcon(type=${v.type})}"></span>
                    <span th:text="${v.type}"></span>
                </td>
                <td><span th:class="'badge badge-' + ${v.status.name().toLowerCase()}" th:text="${v.status}"></span></td>
                <td th:text="${v.pricingPolicy.pricePerUnit} + ' / ' + ${v.pricingPolicy.billingModel}"></td>
                <td th:text="${v.location.latitude} + ', ' + ${v.location.longitude}"></td>
                <td>
                    <a th:href="@{/ui/vehicles/{id}/edit(id=${v.id})}" class="btn ghost small">Edit</a>
                    <form th:action="@{/ui/vehicles/{id}/delete(id=${v.id})}" method="post" class="inline">
                        <input type="hidden" name="providerId" th:value="${providerId}"/>
                        <button type="submit" class="btn danger small">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="empty-state" th:if="${#lists.isEmpty(vehicles)}">
            <span class="icon">🚲</span>
            No vehicles registered yet for this provider.
        </div>
    </div>

    <div class="card">
        <h2>Register a new vehicle</h2>
        <form th:action="@{/ui/provider/{providerId}/fleet(providerId=${providerId})}" method="post">
            <div class="field-row">
                <div>
                    <label>Type
                        <select name="type">
                            <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </label>
                </div>
                <div>
                    <label>Billing model
                        <select name="billingModel">
                            <option th:each="b : ${billingModels}" th:value="${b}" th:text="${b}"></option>
                        </select>
                    </label>
                </div>
            </div>

            <label>Description
                <input type="text" name="description" placeholder="e.g. City e-scooter, well maintained"/>
            </label>

            <div class="field-row">
                <div>
                    <label>Price per unit
                        <input type="number" step="0.01" name="pricePerUnit" required/>
                    </label>
                    <p class="help">Interpreted per the selected billing model.</p>
                </div>
                <div></div>
            </div>

            <div class="field-row">
                <div><label>Max duration (minutes) <input type="number" name="maxDurationMinutes"/></label></div>
                <div><label>Max kilometers <input type="number" name="maxKilometers"/></label></div>
            </div>
            <div class="field-row">
                <div><label>Min age <input type="number" name="minAge"/></label></div>
                <div><label>Max persons <input type="number" name="maxPersons"/></label></div>
            </div>
            <div class="field-row">
                <div><label>Latitude <input type="number" step="0.0001" name="latitude" required/></label></div>
                <div><label>Longitude <input type="number" step="0.0001" name="longitude" required/></label></div>
            </div>

            <button type="submit" class="btn accent">Create vehicle</button>
        </form>
    </div>
</main>
</body>
</html>
