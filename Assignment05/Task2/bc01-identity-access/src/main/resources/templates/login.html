<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Login - Identity &amp; Access</title>
  <link rel="stylesheet" th:href="@{/css/theme.css}"/>
</head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<main class="narrow">
  <h1>&#128273; Login</h1>
  <p class="subtitle">Log in as a rider or a provider.</p>

  <div class="card">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <form th:action="@{/ui/login}" method="post">
      <label for="principalType">Account type</label>
      <select id="principalType" name="principalType">
        <option value="USER" th:selected="${principalType == null or principalType == 'USER'}">&#128100; User</option>
        <option value="PROVIDER" th:selected="${principalType == 'PROVIDER'}">&#127970; Provider</option>
      </select>

      <div class="field-row">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" th:value="${email}" required/>
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required/>
        </div>
      </div>

      <button type="submit">Login</button>
    </form>
  </div>

  <p class="muted"><a th:href="@{/ui}">&larr; Back to home</a></p>
</main>
</body>
</html>
