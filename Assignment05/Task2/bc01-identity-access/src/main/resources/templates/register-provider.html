<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Register Provider - Identity &amp; Access</title>
  <link rel="stylesheet" th:href="@{/css/theme.css}"/>
</head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<main class="narrow">
  <h1>&#127970; Register as a Provider</h1>
  <p class="subtitle">Register your company to start listing vehicles.</p>

  <div class="card">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <form th:action="@{/ui/register/provider}" method="post">
      <div class="field-row">
        <div>
          <label for="companyName">Company name</label>
          <input type="text" id="companyName" name="companyName" th:value="${companyName}" required/>
        </div>
        <div>
          <label for="contactName">Contact name</label>
          <input type="text" id="contactName" name="contactName" th:value="${contactName}" required/>
        </div>
      </div>

      <div class="field-row">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" th:value="${email}" required/>
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required/>
        </div>
      </div>

      <label for="phoneNumber">Phone number</label>
      <input type="text" id="phoneNumber" name="phoneNumber" th:value="${phoneNumber}"/>
      <div class="help">Optional</div>

      <button type="submit">Register</button>
    </form>
  </div>

  <p class="muted"><a th:href="@{/ui}">&larr; Back to home</a></p>
</main>
</body>
</html>
