<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Login Successful - Identity &amp; Access</title>
  <link rel="stylesheet" th:href="@{/css/theme.css}"/>
</head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<main class="narrow">
  <h1>Login successful</h1>
  <div class="alert alert-success">
    <span th:if="${principalType == 'PROVIDER'}">&#127970; Provider authenticated.</span>
    <span th:if="${principalType == 'USER'}">&#128100; User authenticated.</span>
  </div>

  <div class="card">
    <dl class="kv">
      <dt>Principal type</dt>
      <dd><span class="badge" th:classappend="${principalType == 'PROVIDER'} ? 'badge-info' : 'badge-success'" th:text="${principalType}"></span></dd>
      <dt>Principal id</dt>
      <dd th:text="${principalId}"></dd>
      <dt>Token</dt>
      <dd><code th:text="${token}"></code></dd>
      <dt>Expires at</dt>
      <dd th:text="${expiresAt}"></dd>
    </dl>
  </div>

  <div class="card">
    <h2>What next?</h2>
    <a class="btn ghost" th:href="@{/token-inspector(token=${token})}">Check this token in the Token Inspector</a>
    <a class="btn ghost" th:if="${principalType == 'USER'}" th:href="@{/ui/users/{id}(id=${principalId})}">View profile</a>
    <a class="btn ghost" th:if="${principalType == 'PROVIDER'}" th:href="@{/ui/providers/{id}(id=${principalId})}">View profile</a>
  </div>

  <p class="muted"><a th:href="@{/ui}">&larr; Back to home</a></p>
</main>
</body>
</html>
