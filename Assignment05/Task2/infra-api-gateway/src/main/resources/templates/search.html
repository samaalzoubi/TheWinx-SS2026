<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Search vehicles')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="card">
    <h2>Search available vehicles</h2>
    <p th:if="${param.error}" class="error" th:text="${param.error[0]}"></p>
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <form method="get" action="/search">
        <label>Latitude<input type="number" step="any" name="lat" th:value="${lat}"/></label>
        <label>Longitude<input type="number" step="any" name="lon" th:value="${lon}"/></label>
        <label>Radius (km)<input type="number" step="any" name="radiusKm" th:value="${radiusKm}"/></label>
        <label>Vehicle type (optional)
            <select name="type">
                <option value="">Any</option>
                <option value="E_SCOOTER" th:selected="${type == 'E_SCOOTER'}">E-Scooter</option>
                <option value="BICYCLE" th:selected="${type == 'BICYCLE'}">Bicycle</option>
                <option value="E_BIKE" th:selected="${type == 'E_BIKE'}">E-Bike</option>
                <option value="E_CAR" th:selected="${type == 'E_CAR'}">Car</option>
            </select>
        </label>
        <label>Max price per unit (optional)<input type="number" step="any" name="maxPrice" th:value="${maxPrice}"/></label>
        <button type="submit">Search</button>
    </form>
</div>

<div class="card" th:if="${results != null}">
    <h2>Results</h2>
    <div class="empty-state" th:if="${#lists.isEmpty(results)}">
        <span class="icon">🔍</span>
        No available vehicles matched your search.
    </div>
    <div class="vehicle-grid" th:unless="${#lists.isEmpty(results)}">
        <div class="vehicle-card" th:each="v : ${results}">
            <div class="vehicle-card-top">
                <span class="vehicle-icon" th:text="${v.type() == 'E_SCOOTER'} ? '🛴' : (${v.type() == 'BICYCLE'} ? '🚲' : (${v.type() == 'E_BIKE'} ? '⚡' : '🚗'))">🚘</span>
                <span class="vehicle-price"><span th:text="${v.pricePerUnit()}">0</span> €<span class="unit" th:text="'/' + (${v.billingModel() == 'PER_HOUR'} ? 'hr' : 'km')">/unit</span></span>
            </div>
            <p class="vehicle-type" th:text="${v.type()}">TYPE</p>
            <p class="vehicle-desc" th:text="${v.description()}">desc</p>
            <div class="vehicle-meta">
                <span class="chip" th:if="${v.minAge() != null}" th:text="'Age ' + ${v.minAge()} + '+'">age</span>
                <span class="chip" th:if="${v.maxPersons() != null}" th:text="'Max ' + ${v.maxPersons()} + ' pax'">persons</span>
            </div>
            <div class="vehicle-actions">
                <form method="post" action="/bookings">
                    <input type="hidden" name="vehicleId" th:value="${v.id()}"/>
                    <button type="submit">Book this ride</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
