<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='My ratings')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<p th:if="${error}" class="error" th:text="${error}"></p>

<div class="card">
    <h2>Ratings received - <span th:text="${companyName}">Company</span></h2>
    <p><a href="/provider/dashboard">&larr; Back to fleet</a></p>

    <p class="muted" th:if="${#lists.isEmpty(ratings)}">No ratings yet.</p>

    <table th:unless="${#lists.isEmpty(ratings)}">
        <thead>
        <tr><th>Vehicle</th><th>Booking</th><th>Vehicle score</th><th>Provider score</th><th>Comment</th><th>Date</th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${ratings}">
            <td th:text="'#' + ${r.vehicleId()}">v</td>
            <td th:text="'#' + ${r.bookingId()}">b</td>
            <td th:text="${T(com.winx.gateway.web.Stars).render(r.vehicleScore())}">stars</td>
            <td th:text="${T(com.winx.gateway.web.Stars).render(r.providerScore())}">stars</td>
            <td th:text="${r.comment()} ?: '-'">comment</td>
            <td th:text="${r.createdAt()}">date</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
