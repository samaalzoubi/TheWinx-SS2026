<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Fleet dashboard')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<p th:if="${error}" class="error" th:text="${error}"></p>
<p th:if="${param.error}" class="error" th:text="${param.error[0]}"></p>

<div class="stat-grid">
    <div class="stat-tile"><span class="icon">🚗</span><span class="value" th:text="${totalVehicles}">0</span><span class="label">Vehicles</span></div>
    <div class="stat-tile"><span class="icon">✅</span><span class="value" th:text="${availableCount}">0</span><span class="label">Available</span></div>
    <div class="stat-tile"><span class="icon">⏳</span><span class="value" th:text="${bookedCount}">0</span><span class="label">Booked now</span></div>
    <a class="stat-tile" href="/provider/ratings"><span class="icon">⭐</span><span class="value" th:text="${overallRatingCount}">0</span><span class="label">Ratings received &rarr;</span></a>
    <a class="stat-tile" href="/provider/earnings"><span class="icon">💶</span><span class="value">&rarr;</span><span class="label">View earnings</span></a>
</div>

<div class="card">
    <h2>My fleet</h2>
    <p><a class="button-like" href="/provider/vehicles/new">+ Add vehicle</a></p>

    <div class="empty-state" th:if="${#lists.isEmpty(vehicles)}">
        <span class="icon">🚗</span>
        No vehicles yet - add your first one above.
    </div>

    <div class="vehicle-grid" th:unless="${#lists.isEmpty(vehicles)}">
        <div class="vehicle-card" th:each="v : ${vehicles}">
            <div class="vehicle-card-top">
                <span class="vehicle-icon" th:text="${v.type() == 'E_SCOOTER'} ? '🛴' : (${v.type() == 'BICYCLE'} ? '🚲' : (${v.type() == 'E_BIKE'} ? '⚡' : '🚗'))">🚘</span>
                <span class="badge" th:classappend="${v.status() == 'AVAILABLE'} ? 'badge-completed' : 'badge-active'" th:text="${v.status()}">STATUS</span>
            </div>
            <p class="vehicle-type" th:text="${v.type()}">TYPE</p>
            <p class="vehicle-desc" th:text="${v.description()}">desc</p>
            <div class="vehicle-meta">
                <span class="chip" th:text="${v.pricePerUnit()} + ' € / ' + (${v.billingModel() == 'PER_HOUR'} ? 'hr' : 'km')">price</span>
                <span class="chip" th:if="${v.minAge() != null}" th:text="'Age ' + ${v.minAge()} + '+'">age</span>
                <span class="chip" th:if="${v.maxPersons() != null}" th:text="'Max ' + ${v.maxPersons()} + ' pax'">persons</span>
                <span class="chip" th:with="avg=${averages.get(v.id())}"
                      th:if="${avg != null and avg.averageScore() != null}"
                      th:text="'⭐ ' + ${avg.averageScore()} + '/5 (' + ${avg.count()} + ')'">rating</span>
            </div>
            <div class="vehicle-actions vehicle-actions-row">
                <a class="btn ghost" th:href="@{/provider/vehicles/{id}/edit(id=${v.id()})}">Edit</a>
                <form method="post" th:action="@{/provider/vehicles/{id}/delete(id=${v.id()})}"
                      onsubmit="return confirm('Delete this vehicle?');">
                    <button type="submit" class="danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
