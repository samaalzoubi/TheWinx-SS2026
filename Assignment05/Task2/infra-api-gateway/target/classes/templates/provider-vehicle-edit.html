<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Edit vehicle')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="card">
    <h2>Edit vehicle</h2>
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <form th:if="${vehicle != null}" method="post" th:action="@{/provider/vehicles/{id}/edit(id=${vehicle.id()})}">
        <p class="muted" th:text="'Type: ' + ${vehicle.type()} + ' (fixed at creation)'"></p>
        <label>Description<input type="text" name="description" th:value="${vehicle.description()}" required="required"/></label>
        <label>Price per unit (EUR)<input type="number" step="0.01" name="pricePerUnit" th:value="${vehicle.pricePerUnit()}" required="required"/></label>
        <label>Billing model
            <select name="billingModel" required="required">
                <option value="PER_HOUR" th:selected="${vehicle.billingModel() == 'PER_HOUR'}">Per hour</option>
                <option value="PER_KILOMETER" th:selected="${vehicle.billingModel() == 'PER_KILOMETER'}">Per kilometer</option>
            </select>
        </label>
        <label>Max duration, minutes (optional)<input type="number" name="maxDurationMinutes" th:value="${vehicle.maxDurationMinutes()}"/></label>
        <label>Max distance, km (optional)<input type="number" name="maxKilometers" th:value="${vehicle.maxKilometers()}"/></label>
        <label>Minimum rider age (optional)<input type="number" name="minAge" th:value="${vehicle.minAge()}"/></label>
        <label>Max persons (optional)<input type="number" name="maxPersons" th:value="${vehicle.maxPersons()}"/></label>
        <button type="submit">Save changes</button>
    </form>
</div>
</body>
</html>
