<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Log in')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="card">
    <h2>Log in</h2>
    <p th:if="${info}" class="info" th:text="${info}"></p>
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <form method="post" action="/login" id="loginForm">
        <label>I am a...
            <select name="role" id="role">
                <option value="USER" th:selected="${role == null or role == 'USER'}">User (rider)</option>
                <option value="PROVIDER" th:selected="${role == 'PROVIDER'}">Provider (fleet owner)</option>
            </select>
        </label>
        <label>Email<input type="email" name="email" id="email" required="required"/></label>
        <label>Password<input type="password" name="password" id="password" required="required"/></label>
        <button type="submit">Log in</button>
    </form>
    <p class="muted">No account yet? <a href="/register">Register</a></p>

    <p class="muted" style="margin-top:1.2rem;">Seeded demo accounts (click to fill the form above):</p>
    <div class="quickfill">
        <button type="button" onclick="fillLogin('USER','alice@example.com','password123')">👤 Alice (User)</button>
        <button type="button" onclick="fillLogin('USER','bob@example.com','password123')">👤 Bob (User)</button>
        <button type="button" onclick="fillLogin('PROVIDER','petra@greenwheels.example','password123')">🏢 GreenWheels (Provider)</button>
        <button type="button" onclick="fillLogin('PROVIDER','sam@urbanride.example','password123')">🏢 UrbanRide (Provider)</button>
    </div>
</div>
<script th:inline="none">
    function fillLogin(role, email, password) {
        document.getElementById('role').value = role;
        document.getElementById('email').value = email;
        document.getElementById('password').value = password;
    }
</script>
</body>
</html>
