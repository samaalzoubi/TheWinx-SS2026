<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Ride detail')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<p th:if="${error}" class="error" th:text="${error}"></p>
<p th:if="${error}"><a href="/dashboard">&larr; Back to dashboard</a></p>

<div class="card" th:if="${row != null}">
    <p><a href="/dashboard">&larr; Back to dashboard</a></p>
    <h2 th:text="${row.booking().vehicleType()} + ' (#' + ${row.booking().vehicleId()} + ') - Booking #' + ${row.booking().id()}">Ride</h2>
    <span class="badge"
          th:classappend="${row.booking().status() == 'ACTIVE'} ? 'badge-active' : (${row.booking().status() == 'COMPLETED'} ? 'badge-completed' : 'badge-cancelled')"
          th:text="${row.booking().status()}">STATUS</span>

    <dl class="kv" style="margin-top:1.2rem;">
        <dt>Started</dt>
        <dd th:text="${row.booking().startTime()} + ' at (' + ${row.booking().startLatitude()} + ', ' + ${row.booking().startLongitude()} + ')'"></dd>
        <dt>Ended</dt>
        <dd th:if="${row.booking().endTime() != null}" th:text="${row.booking().endTime()} + ' at (' + ${row.booking().endLatitude()} + ', ' + ${row.booking().endLongitude()} + ')'"></dd>
        <dd th:if="${row.booking().endTime() == null}">-</dd>
        <dt>Distance</dt>
        <dd th:text="${row.booking().distanceKm()} ?: '-'"></dd>
        <dt>Billing</dt>
        <dd th:text="${row.booking().pricePerUnit()} + ' EUR / ' + (${row.booking().billingModel() == 'PER_HOUR'} ? 'hour' : 'km')"></dd>
        <dt>Total cost</dt>
        <dd th:text="${row.booking().totalCost()} ?: '-'"></dd>
    </dl>
</div>

<div class="card" th:if="${row != null and row.isCompleted()}">
    <h2>Payment</h2>
    <dl class="kv" th:if="${row.payment() != null}">
        <dt>Status</dt>
        <dd>
            <span class="badge"
                  th:classappend="${row.payment().status() == 'PAID'} ? 'badge-paid' : (${row.payment().status() == 'FAILED'} ? 'badge-failed' : 'badge-pending')"
                  th:text="${row.payment().status()}"></span>
        </dd>
        <dt>Method</dt>
        <dd th:text="${row.payment().paymentMethodType()}"></dd>
        <dt>Amount</dt>
        <dd th:text="${row.payment().amount()} + ' ' + ${row.payment().currency()}"></dd>
        <dt th:if="${row.payment().failureReason() != null}">Failure reason</dt>
        <dd th:if="${row.payment().failureReason() != null}" th:text="${row.payment().failureReason()}"></dd>
    </dl>
    <p th:if="${row.payment() == null}" class="info">Payment status unavailable right now (Payment service unreachable, or no record found).</p>
</div>

<div class="card" th:if="${row != null and row.isCompleted()}">
    <h2>Rating</h2>
    <p th:if="${row.rating() != null}"
       th:text="${row.rating().vehicleScore()} + '/5 vehicle, ' + ${row.rating().providerScore()} + '/5 provider' + (${row.rating().comment() != null} ? (' - “' + ${row.rating().comment()} + '”') : '')"></p>
    <a th:if="${row.canBeRated()}" class="button-like" th:href="@{/ratings/new(bookingId=${row.booking().id()})}">Rate this ride</a>
</div>

<div class="card" th:if="${row != null and row.isActive()}">
    <h2>Actions</h2>
    <form class="inline" method="post" th:action="@{/bookings/{id}/end(id=${row.booking().id()})}"
          th:onsubmit="'return endRideWithLocation(this,' + ${row.booking().startLatitude()} + ',' + ${row.booking().startLongitude()} + ')'">
        <input type="hidden" name="endLatitude"/>
        <input type="hidden" name="endLongitude"/>
        <select name="paymentMethod" style="width:auto;display:inline-block;margin-right:.3rem;">
            <option value="CARD">💳 Card</option>
            <option value="PAYPAL">🅿️ PayPal</option>
        </select>
        <button type="submit" title="Uses your device location to end the ride">📍 End ride</button>
    </form>
    <form class="inline" method="post" th:action="@{/bookings/{id}/cancel(id=${row.booking().id()})}">
        <button type="submit" class="danger">Cancel</button>
    </form>
</div>
</body>
</html>
