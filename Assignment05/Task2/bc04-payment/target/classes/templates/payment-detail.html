<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Payment Detail - BC-04 Payment</title>
    <link rel="stylesheet" href="/css/theme.css"/>
</head>
<body>
<header class="topbar">
    <div class="brand">
        <a th:href="@{/ui}">Instant Mobility</a>
        <span class="tag">BC-04 · Payment</span>
    </div>
    <nav>
        <a th:href="@{/ui}">Home</a>
        <a th:href="@{/ui}">All Payments</a>
        <a th:href="@{/ui/payments/new}">Create Test Payment</a>
    </nav>
</header>

<main class="narrow">
    <p><a th:href="@{/ui}">&larr; back to all payments</a></p>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <h1>Payment #<span th:text="${payment.id}"></span></h1>
    <p class="subtitle">
        <span class="badge" th:classappend="${'badge-' + payment.result.status.name().toLowerCase()}"
              th:text="${payment.result.status}"></span>
    </p>

    <div class="alert alert-error" th:if="${payment.result.failureReason}">
        <strong>Why did this fail?</strong> <span th:text="${payment.result.failureReason}"></span>
    </div>

    <div class="card">
        <h2>Details</h2>
        <dl class="kv">
            <dt>Booking ID</dt><dd th:text="${payment.bookingId}"></dd>
            <dt>User ID</dt><dd th:text="${payment.userId}"></dd>
            <dt>Amount</dt><dd th:text="|${payment.money.amount} ${payment.money.currency}|"></dd>
            <dt>Payment Method</dt><dd th:text="${payment.paymentMethod.type == 'PAYPAL' ? '🅿️' : '💳'} + ' ' + ${payment.paymentMethod.type}"></dd>
            <dt>Masked Reference</dt><dd><code th:text="${payment.paymentMethod.maskedReference}"></code></dd>
            <dt>Status</dt>
            <dd><span class="badge" th:classappend="${'badge-' + payment.result.status.name().toLowerCase()}"
                       th:text="${payment.result.status}"></span></dd>
            <dt>Paid At</dt><dd th:text="${payment.result.paidAt} ?: '-'"></dd>
            <dt>Failure Reason</dt><dd th:text="${payment.result.failureReason} ?: '-'"></dd>
        </dl>

        <form th:if="${payment.result.status.name() == 'FAILED'}"
              th:action="@{/ui/payments/{id}/retry(id=${payment.id})}" method="post">
            <button type="submit" class="btn accent">Retry Payment</button>
        </form>
    </div>
</main>
</body>
</html>
