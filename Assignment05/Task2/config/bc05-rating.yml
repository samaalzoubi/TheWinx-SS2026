# Centrally-managed overrides for bc05-rating.
# Rating calls out to Booking (verify COMPLETED) and Fleet (resolve providerId
# for a vehicle) — each guarded by its own Resilience4j circuit breaker.
resilience4j:
  circuitbreaker:
    instances:
      bookingClient:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      fleetClient:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      bookingClient:
        timeout-duration: 3s
      fleetClient:
        timeout-duration: 3s
